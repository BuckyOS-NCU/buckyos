name: buckyos
services:
  buckyos:
    build:
      context: .
      network: host
      args:
        BUCKYOS_CONFIG_GROUP: ${BUCKYOS_CONFIG_GROUP:-release}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    image: buckyos-local:0.7.0-${BUCKYOS_CONFIG_GROUP:-release}
    container_name: buckyos
    privileged: true
    restart: unless-stopped
    tmpfs:
      - /run
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
      - "0.0.0.0:2980:2980/tcp"
      - "0.0.0.0:2980:2980/udp"
      - "127.0.0.1:3182:3182"
    volumes:
      - runtime:/opt/buckyos
      - docker-data:/var/lib/docker
volumes:
  runtime:
    name: buckyos_${BUCKYOS_CONFIG_GROUP:-release}_runtime
  docker-data:
    name: buckyos_${BUCKYOS_CONFIG_GROUP:-release}_docker-data
