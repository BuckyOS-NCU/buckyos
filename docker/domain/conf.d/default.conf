server {
    listen 80 default_server;
    server_name _;
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
    location / {
        return 404;
    }
}

server {
    listen 80;
    server_name zone.example.com *.zone.example.com;
    return 308 https://$host$request_uri;
}
